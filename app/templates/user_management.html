<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <script defer src="/static/js/alpine.min.js"></script>
    <style>
        .user-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fff;
        }
        .user-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .user-name {
            font-weight: 600;
            color: #333;
        }
        .user-role {
            font-size: 12px;
            color: #999;
        }
        .btn-danger {
            background: linear-gradient(135deg, #f5576c 0%, #d63447 100%);
            color: #fff;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #e5e5e5;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container" x-data="userMgmt()" x-init="init()">
        <div class="header">
            <h1 class="login-title">用户管理</h1>
        </div>

        <form @submit.prevent="handleCreate()">
            <div class="form-group">
                <label class="form-label">新用户名</label>
                <input type="text" class="form-input" x-model="newUsername" placeholder="例如：user1" required />
            </div>
            <div class="form-group">
                <label class="form-label">新密码（至少6位）</label>
                <input type="password" class="form-input" x-model="newPassword" placeholder="******" required />
            </div>

            <div class="error-message" x-show="errorMessage" x-text="errorMessage"></div>
            <div class="success-message" x-show="successMessage" x-text="successMessage"></div>

            <button type="submit" class="btn-primary">创建用户</button>
            <button type="button" class="btn-secondary" style="width:100%; margin-top:10px;" @click="goBack()">返回</button>
        </form>

        <div class="user-list">
            <template x-for="u in users" :key="u.username">
                <div class="user-item">
                    <div class="user-meta">
                        <div class="user-name" x-text="u.username"></div>
                        <div class="user-role" x-text="u.is_admin ? '管理员' : '普通用户'"></div>
                    </div>
                    <button class="btn-danger" x-show="u.username !== 'admin'" @click="handleDelete(u.username)">删除</button>
                </div>
            </template>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script>
        function userMgmt() {
            return {
                users: [],
                newUsername: '',
                newPassword: '',
                errorMessage: '',
                successMessage: '',

                async init() {
                    await this.loadUsers();
                },

                async loadUsers() {
                    this.errorMessage = '';
                    const result = await apiRequest('/api/users', { method: 'GET' });
                    if (result.ok && result.data.success) {
                        this.users = result.data.users || [];
                    } else {
                        this.errorMessage = result.data.message || '加载用户失败';
                    }
                },

                async handleCreate() {
                    this.errorMessage = '';
                    this.successMessage = '';
                    const result = await apiRequest('/api/users', {
                        method: 'POST',
                        body: JSON.stringify({ username: this.newUsername.trim(), password: this.newPassword })
                    });
                    if (result.ok && result.data.success) {
                        this.successMessage = '创建成功';
                        this.newUsername = '';
                        this.newPassword = '';
                        await this.loadUsers();
                    } else {
                        this.errorMessage = result.data.message || '创建失败';
                    }
                },

                async handleDelete(username) {
                    if (!confirm(`确定删除用户 ${username} 吗？`)) return;
                    this.errorMessage = '';
                    this.successMessage = '';
                    const result = await apiRequest(`/api/users/${encodeURIComponent(username)}`, { method: 'DELETE' });
                    if (result.ok && result.data.success) {
                        this.successMessage = '删除成功';
                        await this.loadUsers();
                    } else {
                        this.errorMessage = result.data.message || '删除失败';
                    }
                },

                goBack() {
                    navigateTo('/dashboard');
                }
            };
        }
    </script>
</body>
</html>
