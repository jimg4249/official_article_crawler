<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <script defer src="/static/js/alpine.min.js"></script>
</head>
<body>
    <div class="modal-overlay" x-data="changePasswordForm()">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">修改密码</h2>
                <button class="close-button" @click="handleClose()">&times;</button>
            </div>

            <form @submit.prevent="handleSubmit()">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">旧密码</label>
                        <input
                            type="password"
                            class="form-input"
                            x-model="oldPassword"
                            placeholder="请输入旧密码"
                            autocomplete="current-password"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label class="form-label">新密码</label>
                        <input
                            type="password"
                            class="form-input"
                            x-model="newPassword"
                            placeholder="请输入新密码"
                            autocomplete="new-password"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label class="form-label">确认新密码</label>
                        <input
                            type="password"
                            class="form-input"
                            x-model="confirmPassword"
                            placeholder="请再次输入新密码"
                            autocomplete="new-password"
                            required
                        />
                    </div>

                    <div class="error-message" x-show="errorMessage" x-text="errorMessage"></div>
                    <div class="success-message" x-show="successMessage" x-text="successMessage"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" @click="handleClose()">取消</button>
                    <button type="submit" class="btn btn-confirm">确认修改</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script>
        function changePasswordForm() {
            return {
                oldPassword: '',
                newPassword: '',
                confirmPassword: '',
                errorMessage: '',
                successMessage: '',

                async handleSubmit() {
                    this.errorMessage = '';
                    this.successMessage = '';

                    // 验证新密码
                    if (this.newPassword !== this.confirmPassword) {
                        this.errorMessage = '两次输入的新密码不一致';
                        return;
                    }

                    if (this.newPassword.length < 6) {
                        this.errorMessage = '新密码长度至少为6位';
                        return;
                    }

                    const result = await apiRequest('/change-password', {
                        method: 'POST',
                        body: JSON.stringify({
                            old_password: this.oldPassword,
                            new_password: this.newPassword,
                        })
                    });

                    if (result.ok && result.data.success) {
                        navigateTo('/dashboard');
                    } else {
                        this.errorMessage = result.data.message || '修改密码失败';
                    }
                },

                handleClose() {
                    navigateTo('/dashboard');
                }
            };
        }
    </script>
</body>
</html>
